version: '3.8'

services:
  web:
    image: php:8.2-apache
    container_name: vefa_web_app_231
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=vefa_community_db
      - DB_USER=vefa_user
      - DB_PASS=vefa_secure_pass
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: vefa_mariadb_231
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=vefa_root_secret
      - MYSQL_DATABASE=vefa_community_db
      - MYSQL_USER=vefa_user
      - MYSQL_PASSWORD=vefa_secure_pass
    volumes:
      - db_data_231:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data_231:
